<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5543c9">
  <meta name="description" content="تجربة — إدارة الخدمات التقنية. المملكة العربية السعودية.">
  <title>تجربة | إدارة الخدمات التقنية</title>
  <link rel="canonical" href="https://tajroba.sa/">
  <link rel="icon" type="image/jpeg" href="assets/images/tajroba-logo.jpg">
  <style>
    @font-face{font-family:"Tajawal";src:url("assets/fonts/tajawal-regular.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:"Tajawal";src:url("assets/fonts/tajawal-bold.woff2") format("woff2");font-weight:700;font-display:swap}
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#17142b;--muted:#6b6880;--accent:#5543c9;--line:#e7e5f0;--bg:#faf9fd}
    html,body{height:100%}
    body{font-family:"Tajawal",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;line-height:1.7;-webkit-font-smoothing:antialiased}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
    .card{max-width:560px;width:100%;text-align:center}
    .logo{width:96px;height:96px;border-radius:24px;object-fit:cover;object-position:top;margin:0 auto 28px;display:block;box-shadow:0 8px 30px rgba(85,67,201,.15)}
    h1{font-size:2.4rem;font-weight:700;letter-spacing:-.01em}
    .en{direction:ltr;color:var(--muted);font-size:.95rem;margin-top:2px}
    .tag{display:inline-block;margin-top:22px;padding:8px 18px;border-radius:999px;background:rgba(85,67,201,.08);color:var(--accent);font-weight:700}
    p.lead{margin-top:18px;color:var(--muted);font-size:1.05rem}
    .contact{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    .contact a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:#fff;font-size:.95rem}
    .contact a:hover{border-color:var(--accent);color:var(--accent)}
    footer{border-top:1px solid var(--line);padding:20px 24px;text-align:center;color:var(--muted);font-size:.85rem}
    footer span{display:inline-block;margin:0 8px}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="assets/images/tajroba-logo.jpg" alt="تجربة" width="400" height="400">
      <h1>تجربة</h1>
      <div class="en">Tajroba</div>
      <div class="tag">إدارة الخدمات التقنية</div>
      <p class="lead">تعمل تجربة في مجال إدارة الخدمات التقنية.</p>
      <div class="contact">
        <a href="mailto:support@tajroba.sa"><span dir="ltr">support@tajroba.sa</span></a>
        <a href="https://x.com/TajrobaSA" target="_blank" rel="noopener noreferrer"><span dir="ltr">@TajrobaSA</span></a>
      </div>
    </div>
  </main>
  <footer>
    <span>المملكة العربية السعودية</span>
    <span>© 2026 تجربة. جميع الحقوق محفوظة.</span>
  </footer>
</body>
</html>
